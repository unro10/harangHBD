<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPY BIRTHDAY HARANG</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --red:#ff4d4d;
    --blue:#4361ee;
    --dark:#1a1a2e;
    --gray:#666;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Noto Sans KR', sans-serif;
    background:var(--white);
    color:var(--dark);
    overflow-x:hidden;
    position:relative;
  }

  /* ===== 1. 떠오르는 배경 장식 ===== */
  .floating-decorations{
    position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;
  }
  .floating-decorations span{
    position:absolute; bottom:-10%; opacity:0;
    animation-name:floatUp; animation-timing-function:linear; animation-iteration-count:infinite;
    filter:drop-shadow(0 0 6px rgba(0,0,0,.1));
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:.55; }
    50%{ transform:translateY(-60vh) rotate(180deg); opacity:.85; }
    90%{ opacity:.25; }
    100%{ transform:translateY(-130vh) rotate(360deg); opacity:0; }
  }

  section, header, footer{
    position:relative; z-index:1;
    background:rgba(255,255,255,0.92);
  }

  /* ===== 헤더 ===== */
  header{ text-align:center; padding:70px 20px 40px; }
  .console-buttons{ margin-bottom:20px; }
  .console-buttons span{
    display:inline-block; width:34px; height:34px; border-radius:50%;
    color:#fff; font-family:'Press Start 2P'; font-size:.8rem;
    line-height:34px; margin:0 6px; box-shadow:0 3px 0 rgba(0,0,0,.3);
  }
  .btn-a{ background:var(--red); }
  .btn-b{ background:var(--blue); }

  h1{
    font-family:'Press Start 2P', sans-serif;
    font-size:2rem;
    color:var(--blue);
    text-shadow:3px 3px 0 var(--red);
    line-height:1.4;
  }
  .subtitle{
    margin-top:16px; font-family:'Press Start 2P';
    font-size:.8rem; color:var(--dark);
    animation:blink 1.2s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .section-title{
    text-align:center; font-family:'Press Start 2P';
    font-size:1.2rem; color:var(--dark); margin-bottom:30px;
    padding-top:10px;
  }

  /* ===== 2. 카운트다운 ===== */
  #countdown-section{ padding:40px 20px 60px; text-align:center; }
  .countdown-numbers{
    display:flex; justify-content:center; align-items:center;
    gap:10px; flex-wrap:wrap;
  }
  .cd-box{
    background:#111; border-radius:10px; padding:16px 14px;
    min-width:80px; text-align:center;
  }
  .cd-box.red{ border:3px solid var(--red); box-shadow:0 0 18px rgba(255,77,77,.4); }
  .cd-box.blue{ border:3px solid var(--blue); box-shadow:0 0 18px rgba(67,97,238,.4); }
  .cd-box span{
    display:block; font-family:'Press Start 2P'; font-size:1.8rem; color:#fff;
  }
  .cd-box label{
    display:block; margin-top:6px; font-size:.65rem; color:#aaa; letter-spacing:1px;
  }
  .cd-sep{ font-family:'Press Start 2P'; font-size:1.6rem; color:var(--dark); }

  #countdown-title.celebrate{
    color:var(--red); animation:pulse 1s infinite; font-size:1.5rem;
  }
  @keyframes pulse{ 50%{ transform:scale(1.08); } }

  /* ===== 3. 앨범(엽서 느낌) ===== */
  #album-section{ padding:40px 20px 100px; }
  .album{
    position:relative; max-width:900px; height:650px; margin:0 auto;
  }
  .card{
    position:absolute; width:220px; background:#fff;
    padding:12px 12px 34px; border-radius:4px;
    box-shadow:0 8px 18px rgba(0,0,0,.18);
    transform:rotate(var(--rot));
    transition:transform .35s ease, box-shadow .35s ease, z-index 0s;
    cursor:pointer; text-decoration:none; color:var(--dark); display:block;
  }
  .card img{ width:100%; display:block; border:2px solid #f2f2f2; }
  .card .caption{
    margin-top:10px; text-align:center; font-size:.85rem; color:var(--gray);
  }
  .card:hover{
    transform:rotate(0deg) scale(1.15);
    box-shadow:0 16px 30px rgba(0,0,0,.28);
    z-index:20;
  }
  .ribbon{
    position:absolute; top:-14px; left:50%;
    width:64px; height:22px; border-radius:3px;
    transform:translateX(-50%) rotate(-3deg);
    box-shadow:0 3px 6px rgba(0,0,0,.25);
  }
  .ribbon.r{ background:var(--red); }
  .ribbon.b{ background:var(--blue); }

  /* ===== 4. 방명록 ===== */
  #guestbook{ padding:40px 20px 100px; }
  .guestbook-wrap{
    display:flex; gap:30px; max-width:1000px; margin:0 auto;
  }
  .guestbook-write, .guestbook-list{
    flex:1; background:#fafafa; border-radius:12px; padding:24px;
    border:2px solid #eee;
  }
  .guestbook-write h3{ margin-bottom:14px; }
  .guestbook-write input, .guestbook-write textarea{
    width:100%; padding:10px; margin-bottom:12px;
    border:2px solid #ddd; border-radius:8px; font-family:inherit; font-size:.95rem;
    resize:vertical;
  }
  .guestbook-write textarea{ min-height:100px; }
  .guestbook-write button{
    width:100%; padding:12px; border:none; border-radius:8px;
    background:var(--blue); color:#fff; font-weight:700; font-size:1rem;
    cursor:pointer; transition:background .2s;
  }
  .guestbook-write button:hover{ background:var(--red); }

  .guestbook-list{ max-height:520px; overflow-y:auto; }
  .letter-card{
    background:#fff; border-radius:10px; padding:14px 16px; margin-bottom:12px;
    border-left:5px solid var(--red); box-shadow:0 3px 8px rgba(0,0,0,.06);
    position:relative;
  }
  .letter-card:nth-child(even){ border-left-color:var(--blue); }
  .letter-card strong{ display:block; margin-bottom:6px; color:var(--dark); }
  .letter-card p{ font-size:.9rem; color:#333; white-space:pre-wrap; word-break:break-word; }
  .letter-date{ display:block; margin-top:8px; font-size:.7rem; color:#aaa; }
  .del-btn{
    position:absolute; top:10px; right:10px; background:var(--red); color:#fff;
    border:none; border-radius:6px; padding:4px 8px; font-size:.7rem; cursor:pointer;
  }
  .empty{ text-align:center; color:#aaa; padding:40px 0; }

  /* ===== 푸터 ===== */
  footer{ text-align:center; padding:30px; color:#999; font-size:.8rem; }
  .admin-btn{
    margin-top:10px; background:none; border:1px solid #ccc; border-radius:6px;
    padding:4px 10px; cursor:pointer; font-size:.8rem; color:#999;
  }

  /* ===== 5. 반응형 (900px 이하) ===== */
  @media(max-width:900px){
    h1{ font-size:1.3rem; }
    .subtitle{ font-size:.65rem; }
    .section-title{ font-size:1rem; }

    .cd-box{ min-width:60px; padding:12px 8px; }
    .cd-box span{ font-size:1.3rem; }

    .album{ position:relative; height:auto; display:flex; flex-direction:column; align-items:center; gap:40px; }
    .card{
      position:relative !important; top:auto !important; left:auto !important;
      width:70%; max-width:250px;
    }

    .guestbook-wrap{ flex-direction:column; }
  }
</style>
</head>
<body>

  <!-- ===== 떠오르는 배경 장식 ===== -->
  <div class="floating-decorations" aria-hidden="true">
    <span style="left:5%;  font-size:2.2rem; animation-duration:18s; animation-delay:0s;">🎮</span>
    <span style="left:18%; font-size:1.8rem; animation-duration:22s; animation-delay:3s;">🐯</span>
    <span style="left:32%; font-size:2rem;   animation-duration:16s; animation-delay:1s;">🕹️</span>
    <span style="left:48%; font-size:1.6rem; animation-duration:25s; animation-delay:5s;">⭐</span>
    <span style="left:62%; font-size:2.4rem; animation-duration:20s; animation-delay:2s;">🎮</span>
    <span style="left:75%; font-size:1.9rem; animation-duration:19s; animation-delay:4s;">🐯</span>
    <span style="left:88%; font-size:2rem;   animation-duration:23s; animation-delay:6s;">⭐️</span>
    <span style="left:10%; font-size:1.7rem; animation-duration:21s; animation-delay:8s;">🕹️</span>
  </div>

  <!-- ===== 헤더 ===== -->
  <header>
    <div class="console-buttons">
      <span class="btn-a">A</span><span class="btn-b">B</span>
    </div>
    <h1>🎮 HAPPY BIRTHDAY HARANG 🎮</h1>
    <p class="subtitle">PRESS START TO CELEBRATE ▶</p>
  </header>

  <!-- ===== 카운트다운 ===== -->
  <section id="countdown-section">
    <h2 id="countdown-title" class="section-title">⏰ HARANG의 생일까지</h2>
    <div id="countdown-numbers" class="countdown-numbers">
      <div class="cd-box red"><span id="cd-day">00</span><label>DAYS</label></div>
      <div class="cd-sep">:</div>
      <div class="cd-box blue"><span id="cd-hour">00</span><label>HOUR</label></div>
      <div class="cd-sep">:</div>
      <div class="cd-box red"><span id="cd-min">00</span><label>MIN</label></div>
      <div class="cd-sep">:</div>
      <div class="cd-box blue"><span id="cd-sec">00</span><label>SEC</label></div>
    </div>
  </section>

  <!-- ===== 사진 앨범 ===== -->
  <section id="album-section">
    <h2 class="section-title">📸 찰칵찰칵! </h2>
    <div class="album">
      <!-- TODO: 실제 사진 경로로 교체하세요 -->
      <div class="card" style="--rot:-6deg; top:0px; left:2%;">
        <div class="ribbon r"></div>
        <img src="1.png" alt="사진1">

      </div>

      <div class="card" style="--rot:5deg; top:90px; left:33%;">
        <div class="ribbon b"></div>
        <img src="2.png" alt="사진2">
        <p class="caption">공란 </p>
      </div>

      <div class="card" style="--rot:-3deg; top:20px; left:64%;">
        <div class="ribbon r"></div>
        <img src="3.png" alt="사진3">
        <p class="caption">우결했어요</p>
      </div>

      <!-- 클릭 시 링크로 이동하는 카드 -->
      <a class="card" href="https://www.youtube.com/channel/UCA9BBfUQNTCg7zpKyZ5z9tA" target="_blank" style="--rot:8deg; top:300px; left:12%;">
        <div class="ribbon b"></div>
        <img src="4.png" alt="사진4">
        <p class="caption"> 하랑이 유튜브 보러가기 →</p>
      </a>

      <a class="card" href="https://chzzk.naver.com/e5e69b29ff0056bd23caee179fcd9a03" target="_blank" style="--rot:-8deg; top:320px; left:55%;">
        <div class="ribbon r"></div>

  <!-- ===== 방명록 ===== -->
  <section id="guestbook">
    <h2 class="section-title">💌 방명록</h2>
    <div class="guestbook-wrap">
      <div class="guestbook-write">

        <input type="text" id="gb-name" placeholder="이름" maxlength="20">
        <textarea id="gb-msg" placeholder="하랑이에게 축하 메시지를 남겨주세요!" maxlength="300"></textarea>
        <button id="gb-submit">편지 남기기 💌</button>
      </div>
      <div class="guestbook-list" id="gb-list">
        <p class="empty">불러오는 중...</p>
      </div>
    </div>
  </section>

  <!-- ===== 푸터 ===== -->
  <footer>
    <p>Made with 💖 for HARANG</p>
    <button class="admin-btn" id="admin-toggle">🔒 관리자</button>
  </footer>

  <!-- ===== Firebase (compat SDK) ===== -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    /* ============================================
       🎈 TODO 1: 생일 날짜를 여기서 수정하세요
       ============================================ */
    const targetDate = new Date('2026-09-13T00:00:00'); // YYYY-MM-DDTHH:mm:ss

    function updateCountdown(){
      const now = new Date();
      const diff = targetDate - now;
      const titleEl = document.getElementById('countdown-title');
      const numsEl  = document.getElementById('countdown-numbers');

      if(diff <= 0){
        titleEl.textContent = 'HAPPY BIRTHDAY HARANG 🎉';
        titleEl.classList.add('celebrate');
        numsEl.style.display = 'none';
        return;
      }
      const d = Math.floor(diff / (1000*60*60*24));
      const h = Math.floor((diff / (1000*60*60)) % 24);
      const m = Math.floor((diff / (1000*60)) % 60);
      const s = Math.floor((diff / 1000) % 60);

      document.getElementById('cd-day').textContent  = String(d).padStart(2,'0');
      document.getElementById('cd-hour').textContent = String(h).padStart(2,'0');
      document.getElementById('cd-min').textContent  = String(m).padStart(2,'0');
      document.getElementById('cd-sec').textContent  = String(s).padStart(2,'0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    /* ============================================
       🔥 TODO 2: 본인의 Firebase 프로젝트 설정으로 교체하세요
       (Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 > SDK 설정)
       ============================================ */

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const gbRef = db.ref('guestbook');

    let latestData = null;
    let isAdmin = false;

    /* TODO 3: 관리자 비밀번호를 원하는 값으로 변경하세요 (보안이 중요하면 서버 검증 방식 권장) */
    const ADMIN_PASSWORD = 'harang1234';

    function render(){
      const listEl = document.getElementById('gb-list');
      listEl.innerHTML = '';

      if(!latestData){
        listEl.innerHTML = '<p class="empty">첫 번째 편지를 남겨주세요! 💌</p>';
        return;
      }

      const entries = Object.entries(latestData)
        .sort((a,b) => (b[1].time || 0) - (a[1].time || 0));

      entries.forEach(([key, val]) => {
        const card = document.createElement('div');
        card.className = 'letter-card';

        const nameEl = document.createElement('strong');
        nameEl.textContent = val.name || '익명';

        const msgEl = document.createElement('p');
        msgEl.textContent = val.msg || '';

        const dateEl = document.createElement('span');
        dateEl.className = 'letter-date';
        dateEl.textContent = val.time ? new Date(val.time).toLocaleString() : '';

        card.appendChild(nameEl);
        card.appendChild(msgEl);
        card.appendChild(dateEl);

        if(isAdmin){
          const delBtn = document.createElement('button');
          delBtn.className = 'del-btn';
          delBtn.textContent = '삭제';
          delBtn.onclick = () => {
            if(confirm('이 편지를 삭제하시겠습니까?')){
              gbRef.child(key).remove();
            }
          };
          card.appendChild(delBtn);
        }

        listEl.appendChild(card);
      });
    }

    gbRef.on('value', snap => {
      latestData = snap.val();
      render();
    });

    document.getElementById('gb-submit').addEventListener('click', () => {
      const nameInput = document.getElementById('gb-name');
      const msgInput  = document.getElementById('gb-msg');
      const name = nameInput.value.trim();
      const msg  = msgInput.value.trim();

      if(!name || !msg){
        alert('이름과 메시지를 모두 입력해주세요!');
        return;
      }

      gbRef.push({ name, msg, time: Date.now() });
      nameInput.value = '';
      msgInput.value = '';
    });

    document.getElementById('admin-toggle').addEventListener('click', () => {
      if(isAdmin){
        isAdmin = false;
        alert('관리자 모드가 해제되었습니다.');
        render();
        return;
      }
      const pw = prompt('관리자 비밀번호를 입력하세요');
      if(pw === ADMIN_PASSWORD){
        isAdmin = true;
        alert('관리자 모드가 활성화되었습니다. 삭제 버튼이 표시됩니다.');
        render();
      } else if(pw !== null){
        alert('비밀번호가 올바르지 않습니다.');
      }
    });
  </script>
