<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPY BIRTHDAY HARANG</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --red:#ff4d4d;
    --blue:#4361ee;
    --dark:#1a1a2e;
    --gray:#666;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Noto Sans KR', sans-serif;
    background:var(--white);
    color:var(--dark);
    overflow-x:hidden;
    position:relative;
  }

  /* ===== 1. 떠오르는 배경 장식 ===== */
  .floating-decorations{
    position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;
  }
  .floating-decorations span{
    position:absolute; bottom:-10%; opacity:0;
    animation-name:floatUp; animation-timing-function:linear; animation-iteration-count:infinite;
    filter:drop-shadow(0 0 6px rgba(0,0,0,.1));
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:.55; }
    50%{ transform:translateY(-60vh) rotate(180deg); opacity:.85; }
    90%{ opacity:.25; }
    100%{ transform:translateY(-130vh) rotate(360deg); opacity:0; }
  }

  section, header, footer{
    position:relative; z-index:1;
    background:rgba(255,255,255,0.92);
  }

  /* ===== 헤더 ===== */
  header{ text-align:center; padding:70px 20px 40px; }
  .console-buttons{ margin-bottom:20px; }
  .console-buttons span{
    display:inline-block; width:34px; height:34px; border-radius:50%;
    color:#fff; font-family:'Press Start 2P'; font-size:.8rem;
    line-height:34px; margin:0 6px; box-shadow:0 3px 0 rgba(0,0,0,.3);
  }
  .btn-a{ background:var(--red); }
  .btn-b{ background:var(--blue); }

  h1{
    font-family:'Press Start 2P', sans-serif;
    font-size:2rem;
    color:var(--blue);
    text-shadow:3px 3px 0 var(--red);
    line-height:1.4;
  }
  .subtitle{
    margin-top:16px; font-family:'Press Start 2P';
    font-size:.8rem; color:var(--dark);
    animation:blink 1.2s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .section-title{
    text-align:center; font-family:'Press Start 2P';
    font-size:1.2rem; color:var(--dark); margin-bottom:30px;
    padding-top:10px;
  }

 /* ===== 2. 카운트다운 ===== */
#countdown-section{ padding:40px 20px 60px; text-align:center; }
.countdown-numbers{
  display:flex; justify-content:center; align-items:center;
  gap:10px; flex-wrap:wrap;
}
.cd-box{
  background:#111; border-radius:10px; padding:16px 14px;
  min-width:80px; text-align:center;
}
.cd-box.red{ border:3px solid var(--red); box-shadow:0 0 18px rgba(255,77,77,.4); }
.cd-box.blue{ border:3px solid var(--blue); box-shadow:0 0 18px rgba(67,97,238,.4); }
.cd-box span{
  display:block; font-family:'Press Start 2P'; font-size:1.8rem; color:#fff;
}
.cd-box label{
  display:block; margin-top:6px; font-size:.65rem; color:#aaa; letter-spacing:1px;
}
.cd-sep{ font-family:'Press Start 2P'; font-size:1.6rem; color:var(--dark); }
#countdown-title.celebrate{
  color:var(--red); animation:pulse 1s infinite; font-size:1.5rem;
}
@keyframes pulse{ 50%{ transform:scale(1.08); } }

/* ===== 태블릿 (768px 이하) ===== */
@media(max-width:768px){
  .cd-box{
    min-width:70px;
    padding:14px 12px;
  }
  .cd-box span{
    font-size:1.5rem;
  }
  .cd-box label{
    font-size:.6rem;
  }
  .cd-sep{
    font-size:1.3rem;
    margin:0 4px;
  }
}

/* ===== 모바일 (600px 이하) ===== */
@media(max-width:600px){
  .cd-box{
    min-width:60px;
    padding:12px 10px;
  }
  .cd-box span{
    font-size:1.2rem;
  }
  .cd-box label{
    font-size:.55rem;
    margin-top:4px;
  }
  .cd-sep{
    font-size:1rem;
    margin:0 2px;
  }
  #countdown-title.celebrate{
    font-size:1.1rem;
  }
}

/* ===== 소형 모바일 (480px 이하) ===== */
@media(max-width:480px){
  #countdown-section{
    padding:30px 15px 50px;
  }
  .countdown-numbers{
    gap:6px;
  }
  .cd-box{
    min-width:50px;
    padding:10px 8px;
  }
  .cd-box span{
    font-size:1rem;
  }
  .cd-box label{
    font-size:.5rem;
    margin-top:3px;
    letter-spacing:.5px;
  }
  .cd-sep{
    font-size:.9rem;
    margin:0 1px;
  }
}

  /* ===== 3. 앨범(엽서 느낌) ===== */
  #album-section{ padding:40px 20px 100px; }
  .album{
    position:relative; max-width:900px; height:650px; margin:0 auto;
  }
  .card{
    position:absolute; width:220px; background:#fff;
    padding:12px 12px 34px; border-radius:4px;
    box-shadow:0 8px 18px rgba(0,0,0,.18);
    transform:rotate(var(--rot));
    transition:transform .35s ease, box-shadow .35s ease, z-index 0s;
    cursor:pointer; text-decoration:none; color:var(--dark); display:block;
  }
  .card img{ width:100%; display:block; border:2px solid #f2f2f2; }
  .card .caption{
    margin-top:10px; text-align:center; font-size:.85rem; color:var(--gray);
  }
  .card:hover{
    transform:rotate(0deg) scale(1.15);
    box-shadow:0 16px 30px rgba(0,0,0,.28);
    z-index:20;
  }
  .ribbon{
    position:absolute; top:-14px; left:50%;
    width:64px; height:22px; border-radius:3px;
    transform:translateX(-50%) rotate(-3deg);
    box-shadow:0 3px 6px rgba(0,0,0,.25);
  }
  .ribbon.r{ background:var(--red); }
  .ribbon.b{ background:var(--blue); }

  /* ===== 4. 방명록 ===== */
  #guestbook{ padding:40px 20px 100px; }
  .guestbook-wrap{
    display:flex; gap:30px; max-width:1000px; margin:0 auto;
  }
  .guestbook-write, .guestbook-list{
    flex:1; background:#fafafa; border-radius:12px; padding:24px;
    border:2px solid #eee;
  }
  .guestbook-write h3{ margin-bottom:14px; }
  .guestbook-write input, .guestbook-write textarea{
    width:100%; padding:10px; margin-bottom:12px;
    border:2px solid #ddd; border-radius:8px; font-family:inherit; font-size:.95rem;
    resize:vertical;
  }
  .guestbook-write textarea{ min-height:180px; }
  .guestbook-write button{
    width:100%; padding:12px; border:none; border-radius:8px;
    background:var(--blue); color:#fff; font-weight:700; font-size:1rem;
    cursor:pointer; transition:background .2s;
  }
  .guestbook-write button:hover{ background:var(--red); }

  .guestbook-list{ max-height:520px; overflow-y:auto; }
  .letter-card{
    background:#fff; border-radius:10px; padding:14px 16px; margin-bottom:12px;
    border-left:5px solid var(--red); box-shadow:0 3px 8px rgba(0,0,0,.06);
    position:relative;
  }
  .letter-card:nth-child(even){ border-left-color:var(--blue); }
  .letter-card strong{ display:block; margin-bottom:6px; color:var(--dark); }
  .letter-card p{ font-size:.9rem; color:#333; white-space:pre-wrap; word-break:break-word; }
  .letter-date{ display:block; margin-top:8px; font-size:.7rem; color:#aaa; }
  .del-btn{
    position:absolute; top:10px; right:10px; background:var(--red); color:#fff;
    border:none; border-radius:6px; padding:4px 8px; font-size:.7rem; cursor:pointer;
  }
  .empty{ text-align:center; color:#aaa; padding:40px 0; }

  /* ===== 푸터 ===== */
  footer{ text-align:center; padding:30px; color:#999; font-size:.8rem; }
  .admin-btn{
    margin-top:10px; background:none; border:1px solid #ccc; border-radius:6px;
    padding:4px 10px; cursor:pointer; font-size:.8rem; color:#999;
  }

  /* ===== 5. 반응형 (900px 이하) ===== */
  @media(max-width:900px){
    h1{ font-size:1.3rem; }
    .subtitle{ font-size:.65rem; }
    .section-title{ font-size:1rem; }

    .cd-box{ min-width:60px; padding:12px 8px; }
    .cd-box span{ font-size:1.3rem; }

    .album{ position:relative; height:auto; display:flex; flex-direction:column; align-items:center; gap:40px; }
    .card{
      position:relative !important; top:auto !important; left:auto !important;
      width:70%; max-width:250px;
    }

    .guestbook-wrap{ flex-direction:column; }
  }
    /* ===== 로딩 화면 ===== */
  #loading-screen{
    position:fixed; inset:0; z-index:9999;
    background:var(--dark);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .6s ease, visibility .6s ease;
  }
  #loading-screen.hide{
    opacity:0; visibility:hidden; pointer-events:none;
  }

  .loading-content{
    text-align:center;
    animation:loadingFloat 2s ease-in-out infinite;
  }
  @keyframes loadingFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }

  /* --- 폴라로이드 사진 --- */
  .loading-polaroids{
    position:relative;
    height:150px;
    margin-bottom:20px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
  }

  .polaroid{
    position:absolute;
    width:90px;
    background:#fff;
    padding:8px 8px 20px;
    border-radius:3px;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
    opacity:0;
    transform:scale(0.3) rotate(0deg) translateY(30px);
    animation:polaroidPop .6s ease forwards;
  }
  .polaroid img{
    width:100%;
    height:90px;
    object-fit:cover;
    display:block;
    border:1px solid #eee;
  }

  .polaroid.p1{
    left:50%;
    margin-left:-95px;
    transform-origin:bottom center;
    animation-delay:.3s;
    --final-rot:-12deg;
  }
  .polaroid.p2{
    left:50%;
    margin-left:-45px;
    z-index:2;
    transform-origin:bottom center;
    animation-delay:.6s;
    --final-rot:4deg;
  }
  .polaroid.p3{
    left:50%;
    margin-left:5px;
    transform-origin:bottom center;
    animation-delay:.9s;
    --final-rot:14deg;
  }

  @keyframes polaroidPop{
    0%{
      opacity:0;
      transform:scale(0.3) rotate(0deg) translateY(30px);
    }
    60%{
      opacity:1;
      transform:scale(1.1) rotate(var(--final-rot)) translateY(-5px);
    }
    100%{
      opacity:1;
      transform:scale(1) rotate(var(--final-rot)) translateY(0);
    }
  }

  /* --- A/B 버튼 --- */
  .loading-console{ margin-bottom:24px; }
  .loading-btn{
    display:inline-block; width:36px; height:36px; border-radius:50%;
    color:#fff; font-family:'Press Start 2P'; font-size:.85rem;
    line-height:36px; margin:0 8px; box-shadow:0 3px 0 rgba(0,0,0,.4);
    animation:btnPulse 1s ease-in-out infinite;
  }
  .loading-btn.a{ background:var(--red); animation-delay:0s; }
  .loading-btn.b{ background:var(--blue); animation-delay:.5s; }
  @keyframes btnPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.2); }
  }

  /* --- 타이틀 --- */
  .loading-title{
    font-family:'Press Start 2P';
    font-size:1.3rem; color:#fff;
    line-height:1.8; margin-bottom:30px;
    text-shadow:3px 3px 0 var(--red);
  }

  /* --- 로딩 바 --- */
  .loading-bar-wrap{
    width:280px; max-width:70vw; height:20px;
    background:#333; border:3px solid #fff; border-radius:10px;
    margin:0 auto 14px; overflow:hidden;
    position:relative;
  }
  .loading-bar{
    width:0%; height:100%;
    background:linear-gradient(90deg, var(--red), var(--blue));
    transition:width .1s linear;
    position:relative;
  }
  .loading-bar::after{
    content:'';
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      45deg, rgba(255,255,255,.15) 0 8px,
      transparent 8px 16px
    );
    animation:stripeMove 1s linear infinite;
  }
  @keyframes stripeMove{
    0%{ background-position:0 0; }
    100%{ background-position:32px 0; }
  }

  .loading-text{
    font-family:'Press Start 2P'; font-size:.7rem;
    color:#fff; margin-bottom:20px;
  }

  .loading-blink{
    font-family:'Press Start 2P'; font-size:.65rem;
    color:#aaa; animation:blink 1s step-end infinite;
  }

  /* --- 반응형 --- */
  @media(max-width:900px){
    .loading-title{ font-size:1rem; }
    .loading-bar-wrap{ width:220px; }
    .loading-polaroids{ height:110px; }
    .polaroid{ width:65px; padding:6px 6px 14px; }
    .polaroid img{ height:65px; }
    .polaroid.p1{ margin-left:-68px; }
    .polaroid.p2{ margin-left:-32px; }
    .polaroid.p3{ margin-left:4px; }
  }
  .music-btn{
  cursor:pointer;
  user-select:none;
  transition:transform .15s ease, box-shadow .15s ease;
}
.music-btn:active{
  transform:scale(0.9);
}
.music-btn.active{
  box-shadow:0 0 0 3px #fff, 0 3px 0 rgba(0,0,0,.3);
  transform:scale(1.1);
}
  .letter-card.pinned{
  border: 2px solid var(--red, #e74c3c);
  background: #fff8f8;
  position: relative;
}

.pin-badge{
  position: absolute;
  top: -10px;
  right: 10px;
  background: var(--red, #e74c3c);
  color: #fff;
  font-size: .7rem;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: bold;
}

.pin-btn{
  margin-right: 6px;
  padding: 4px 10px;
  font-size: .75rem;
  border: 1px solid var(--red, #e74c3c);
  background: #fff;
  color: var(--red, #e74c3c);
  border-radius: 6px;
  cursor: pointer;
}
.pin-btn:hover{
  background: var(--red, #e74c3c);
  color: #fff;
}

.gb-link{
  color: var(--red, #e74c3c);
  text-decoration: underline;
  word-break: break-all;
}
.gb-link:hover{
  opacity: .7;
}
  /* ===== 방명록 - 잠금 상태 ===== */
.guestbook-list.locked {
  position: relative;
  filter: blur(8px);
  pointer-events: none;
  user-select: none;
}

.guestbook-list.locked::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.7);
  border-radius: 12px;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lock-overlay {
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 11;
  gap: 15px;
}

.lock-overlay.hidden {
  display: none;
}

.lock-icon {
  font-size: 3rem;
  animation: lockBounce 1s ease-in-out infinite;
}

@keyframes lockBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.lock-text {
  font-family: 'Press Start 2P';
  font-size: 0.9rem;
  color: var(--dark);
  text-align: center;
  line-height: 1.6;
}

.unlock-date {
  font-family: 'Press Start 2P';
  font-size: 0.75rem;
  color: var(--red);
  background: #ffe0e0;
  padding: 8px 16px;
  border-radius: 8px;
  border: 2px solid var(--red);
}

.guestbook-list {
  position: relative;
}
</style>
</head>

    <div class="guestbook-write">
      <h3>편지 쓰기</h3>
      <input type="text" id="gb-name" placeholder="이름" maxlength="20">
      <textarea id="gb-msg" placeholder="하랑이에게 축하 메시지를 남겨주세요!" maxlength="2000"></textarea>
      <button id="gb-submit">편지 남기기 💌</button>
    </div>
    <div class="guestbook-list locked" id="gb-list">
      <div class="lock-overlay" id="lock-overlay">
        <div class="lock-icon">🔒</div>
        <div class="lock-text">
          생일이 될 때까지<br>
          편지를 볼 수 없습니다
        </div>
        <div class="unlock-date" id="unlock-date">2026.09.13</div>
      </div>
      <p class="empty">불러오는 중...</p>
    </div>
  </div>
</section>
  <!-- ===== 푸터 ===== -->
  <footer>
    <p>Made by unro👽(Naeh🐱)</p>
    <button class="admin-btn" id="admin-toggle">🔒 관리자</button>
  </footer>

  <!-- ===== Firebase (compat SDK) ===== -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ============================================
   🎈 생일 날짜
   ============================================ */
const targetDate = new Date('2026-09-13T00:00:00');
let confettiTriggered = false;
let isAdmin = false; // ← 이 줄을 여기로 이동

function checkLockStatus(){
  const now = new Date();
  const gbList = document.getElementById('gb-list');
  const lockOverlay = document.getElementById('lock-overlay');
  
  if(isAdmin || now >= targetDate){
    gbList.classList.remove('locked');
    if(lockOverlay){
      lockOverlay.classList.add('hidden');
    }
  } else {
    gbList.classList.add('locked');
    if(lockOverlay){
      lockOverlay.classList.remove('hidden');
    }
  }
}

function updateCountdown(){
  const now = new Date();
  const diff = targetDate - now;
  const titleEl = document.getElementById('countdown-title');
  const numsEl  = document.getElementById('countdown-numbers');
  
  if(diff <= 0 && !confettiTriggered){
    confettiTriggered = true;
    titleEl.textContent = '🎉 HAPPY BIRTHDAY HARANG 🎉';
    titleEl.classList.add('celebrate');
    numsEl.style.display = 'none';
    checkLockStatus();
    render();
    return;
  }
  
  if(diff <= 0){
    titleEl.textContent = '🎉 HAPPY BIRTHDAY HARANG 🎉';
    titleEl.classList.add('celebrate');
    numsEl.style.display = 'none';
    checkLockStatus();
    return;
  }
  
  const d = Math.floor(diff / (1000*60*60*24));
  const h = Math.floor((diff / (1000*60*60)) % 24);
  const m = Math.floor((diff / (1000*60)) % 60);
  const s = Math.floor((diff / 1000) % 60);
  
  document.getElementById('cd-day').textContent  = String(d).padStart(2,'0');
  document.getElementById('cd-hour').textContent = String(h).padStart(2,'0');
  document.getElementById('cd-min').textContent  = String(m).padStart(2,'0');
  document.getElementById('cd-sec').textContent  = String(s).padStart(2,'0');
}

updateCountdown();
setInterval(updateCountdown, 1000);

window.addEventListener('load', () => {
  const now = new Date();
  if(now >= targetDate && !confettiTriggered){
    confettiTriggered = true;
  }
});

/* ============================================
   🔥 Firebase 설정
   ============================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBqG5BbHMopByNg8zl6kv9T9w6auQD_IjE",
  authDomain: "haranghbd.firebaseapp.com",
  projectId: "haranghbd",
  storageBucket: "haranghbd.firebasestorage.app",
  messagingSenderId: "310123098006",
  appId: "1:310123098006:web:74b2f03dde273fe95177b7",
  measurementId: "G-1PPQT65KFM"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const gbRef = db.ref('guestbook');
let latestData = null;

const ADMIN_PASSWORD = 'imhr0913';

/* ============================================
   🔗 링크 자동 변환 + XSS 방지
   ============================================ */
function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function linkify(text){
  const safe = escapeHTML(text);
  const urlPattern = /(https?:\/\/[^\s]+)/g;
  return safe.replace(urlPattern, url => {
    return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="gb-link">${url}</a>`;
  });
}

/* ============================================
   📋 방명록 렌더링
   ============================================ */
function render(){
  const listEl = document.getElementById('gb-list');
  const now = new Date();
  
  checkLockStatus();
  
  if(!isAdmin && now < targetDate){
    return;
  }
  
  const lockOverlay = listEl.querySelector('.lock-overlay');
  if(lockOverlay && (isAdmin || now >= targetDate)){
    lockOverlay.remove();
  }
  
  const emptyMsg = listEl.querySelector('.empty');
  if(emptyMsg) emptyMsg.remove();
  
  if(!latestData){
    const emptyEl = document.createElement('p');
    emptyEl.className = 'empty';
    emptyEl.textContent = '첫 번째 편지를 남겨주세요! 💌';
    listEl.appendChild(emptyEl);
    return;
  }
  
  const entries = Object.entries(latestData)
    .sort((a,b) => {
      const pinnedA = a[1].pinned ? 1 : 0;
      const pinnedB = b[1].pinned ? 1 : 0;
      if(pinnedA !== pinnedB) return pinnedB - pinnedA;
      return (b[1].time || 0) - (a[1].time || 0);
    });
  
  entries.forEach(([key, val]) => {
    const card = document.createElement('div');
    card.className = 'letter-card' + (val.pinned ? ' pinned' : '');
    
    if(val.pinned){
      const pinBadge = document.createElement('span');
      pinBadge.className = 'pin-badge';
      pinBadge.textContent = '📌 고정';
      card.appendChild(pinBadge);
    }
    
    const nameEl = document.createElement('strong');
    nameEl.textContent = val.name || '익명';
    const msgEl = document.createElement('p');
    msgEl.innerHTML = linkify(val.msg || '');
    const dateEl = document.createElement('span');
    dateEl.className = 'letter-date';
    dateEl.textContent = val.time ? new Date(val.time).toLocaleString() : '';
    
    card.appendChild(nameEl);
    card.appendChild(msgEl);
    card.appendChild(dateEl);
    
    if(isAdmin){
      const pinBtn = document.createElement('button');
      pinBtn.className = 'pin-btn';
      pinBtn.textContent = val.pinned ? '고정 해제' : '고정하기';
      pinBtn.onclick = () => {
        gbRef.child(key).update({ pinned: !val.pinned });
      };
      card.appendChild(pinBtn);
      
      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.textContent = '삭제';
      delBtn.onclick = () => {
        if(confirm('이 편지를 삭제하시겠습니까?')){
          gbRef.child(key).remove();
        }
      };
      card.appendChild(delBtn);
    }
    
    listEl.appendChild(card);
  });
}

gbRef.on('value', snap => {
  latestData = snap.val();
  render();
});

document.getElementById('gb-submit').addEventListener('click', () => {
  const nameInput = document.getElementById('gb-name');
  const msgInput  = document.getElementById('gb-msg');
  const name = nameInput.value.trim();
  const msg  = msgInput.value.trim();
  
  if(!name || !msg){
    alert('이름과 메시지를 모두 입력해주세요!');
    return;
  }
  
  gbRef.push({ name, msg, time: Date.now(), pinned: false });
  nameInput.value = '';
  msgInput.value = '';
});

document.getElementById('admin-toggle').addEventListener('click', () => {
  if(isAdmin){
    isAdmin = false;
    alert('관리자 모드가 해제되었습니다.');
    checkLockStatus();
    render();
    return;
  }
  
  const pw = prompt('관리자 비밀번호를 입력하세요');
  if(pw === ADMIN_PASSWORD){
    isAdmin = true;
    alert('관리자 모드가 활성화되었습니다. 편지를 열람할 수 있습니다.');
    checkLockStatus();
    render();
  } else if(pw !== null){
    alert('비밀번호가 올바르지 않습니다.');
  }
});

/* ============================================
   ⏳ 로딩 화면 (5초)
   ============================================ */
(function(){
  const loadingScreen = document.getElementById('loading-screen');
  const loadingBar = document.getElementById('loading-bar');
  const loadingPercent = document.getElementById('loading-percent');
  const duration = 5000;
  const startTime = Date.now();
  
  function tick(){
    const elapsed = Date.now() - startTime;
    const percent = Math.min(100, Math.floor((elapsed / duration) * 100));
    loadingBar.style.width = percent + '%';
    loadingPercent.textContent = `LOADING... ${percent}%`;
    
    if(elapsed < duration){
      requestAnimationFrame(tick);
    } else {
      loadingBar.style.width = '100%';
      loadingPercent.textContent = 'LOADING... 100%';
      setTimeout(() => {
        loadingScreen.classList.add('hide');
        document.body.style.overflow = 'auto';
      }, 200);
    }
  }
  
  document.body.style.overflow = 'hidden';
  tick();
})();

/* ============================================
   🎵 A/B 버튼 음악 컨트롤
   ============================================ */
(function(){
  const bgm = document.getElementById('bgm');
  bgm.volume = 0.25;
  
  const playButtons = document.querySelectorAll('[data-action="play"]');
  const pauseButtons = document.querySelectorAll('[data-action="pause"]');
  
  function setActiveState(playing){
    playButtons.forEach(btn => btn.classList.toggle('active', playing));
    pauseButtons.forEach(btn => btn.classList.toggle('active', !playing));
  }
  
  function playMusic(){
    bgm.play().then(() => {
      setActiveState(true);
    }).catch(err => {
      console.log('재생 실패:', err);
    });
  }
  
  function pauseMusic(){
    bgm.pause();
    setActiveState(false);
  }
  
  playButtons.forEach(btn => {
    btn.addEventListener('click', playMusic);
  });
  
  pauseButtons.forEach(btn => {
    btn.addEventListener('click', pauseMusic);
  });
})();
</script>

</body>
</html>
